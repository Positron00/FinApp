# prod: payout-worker is the only pod with egress to the bank provider (ADR 0011). The provider's
# hostname can't be matched, so the rule is 0.0.0.0/0 minus cluster, private, link-local, CGNAT and
# metadata ranges, TCP 443 only.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
  - networkpolicy.yaml
