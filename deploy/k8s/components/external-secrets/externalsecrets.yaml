apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: db-bootstrap
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: payrun-secrets } # created by the user (ADR 0008)
  target: { name: db-bootstrap, creationPolicy: Owner }
  data:
    - { secretKey: POSTGRES_PASSWORD, remoteRef: { key: payrun/ENV/POSTGRES_PASSWORD } }
    - {
        secretKey: IDENTITY_DB_MIGRATOR_PASSWORD,
        remoteRef: { key: payrun/ENV/IDENTITY_DB_MIGRATOR_PASSWORD },
      }
    - { secretKey: IDENTITY_DB_PASSWORD, remoteRef: { key: payrun/ENV/IDENTITY_DB_PASSWORD } }
    - {
        secretKey: PAYROLL_DB_MIGRATOR_PASSWORD,
        remoteRef: { key: payrun/ENV/PAYROLL_DB_MIGRATOR_PASSWORD },
      }
    - { secretKey: PAYROLL_DB_PASSWORD, remoteRef: { key: payrun/ENV/PAYROLL_DB_PASSWORD } }
    - {
        secretKey: PAYOUTS_DB_MIGRATOR_PASSWORD,
        remoteRef: { key: payrun/ENV/PAYOUTS_DB_MIGRATOR_PASSWORD },
      }
    - { secretKey: PAYOUTS_DB_PASSWORD, remoteRef: { key: payrun/ENV/PAYOUTS_DB_PASSWORD } }
    - {
        secretKey: POSTGRES_EXPORTER_PASSWORD,
        remoteRef: { key: payrun/ENV/POSTGRES_EXPORTER_PASSWORD },
      }
# Consumed by the Helm-installed or hosted observability stack (Alertmanager receivers, Grafana,
# redis_exporter), not by a workload in this repository.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: observability
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: payrun-secrets } # created by the user (ADR 0008)
  target: { name: observability, creationPolicy: Owner }
  data:
    - { secretKey: ALERT_PAGE_WEBHOOK_URL, remoteRef: { key: payrun/ENV/ALERT_PAGE_WEBHOOK_URL } }
    - {
        secretKey: ALERT_TICKET_WEBHOOK_URL,
        remoteRef: { key: payrun/ENV/ALERT_TICKET_WEBHOOK_URL },
      }
    - { secretKey: GRAFANA_ADMIN_PASSWORD, remoteRef: { key: payrun/ENV/GRAFANA_ADMIN_PASSWORD } }
    - { secretKey: REDIS_EXPORTER_PASSWORD, remoteRef: { key: payrun/ENV/REDIS_EXPORTER_PASSWORD } }
