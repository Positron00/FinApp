# ExternalSecrets for uat and prod (platform LLD §9.6; ADR 0008, R29). One per placeholder Secret,
# same name, so the workloads don't change; the placeholders are deleted by this component.
# Target keys are the C1 process names; remote names are the plan §8 names under payrun/<env>/
# (the overlay replaces the ENV path segment from payrun-env's ENV).
# bank-stub's ExternalSecrets are added by the uat overlay (prod has no bank-stub), and prod adds the
# SMTP keys to identity-secrets (C49).
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: web-secrets
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: payrun-secrets } # created by the user (ADR 0008)
  target: { name: web-secrets, creationPolicy: Owner }
  data:
    - {
        secretKey: INTERNAL_JWT_PRIVATE_KEY,
        remoteRef: { key: payrun/ENV/INTERNAL_JWT_PRIVATE_KEY },
      }
    - { secretKey: INTERNAL_JWT_KID, remoteRef: { key: payrun/ENV/INTERNAL_JWT_KID } }
    - { secretKey: REDIS_PASSWORD, remoteRef: { key: payrun/ENV/REDIS_WEB_PASSWORD } }
    - { secretKey: SESSION_SECRET, remoteRef: { key: payrun/ENV/SESSION_SECRET } }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: identity-secrets
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: payrun-secrets } # created by the user (ADR 0008)
  target: { name: identity-secrets, creationPolicy: Owner }
  data:
    - { secretKey: DB_PASSWORD, remoteRef: { key: payrun/ENV/IDENTITY_DB_PASSWORD } }
    - { secretKey: REDIS_PASSWORD, remoteRef: { key: payrun/ENV/REDIS_IDENTITY_PASSWORD } }
    - { secretKey: AUDIT_IP_HASH_KEY, remoteRef: { key: payrun/ENV/AUDIT_IP_HASH_KEY } }
---
