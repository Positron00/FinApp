# PayRun Redis (platform LLD §2.2, ADR 0007): queue + sessions + limits; never evict, persist with AOF.
port 6379
bind 0.0.0.0
protected-mode yes
aclfile /run/redis/users.acl
dir /data
appendonly yes
appendfsync everysec
aof-use-rdb-preamble yes
maxmemory 256mb
maxmemory-policy noeviction
timeout 0
tcp-keepalive 60
latency-tracking yes
