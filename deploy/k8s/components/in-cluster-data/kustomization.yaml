# In-cluster Postgres 16 and Redis 7 for dev only (ADR 0007: uat and prod use managed services).
# redis/ is a synced copy of deploy/compose/redis/{redis.conf,entrypoint.sh} (R32): never edit it
# here. Passwords come from the dev overlay's generated Secret payrun-dev-secrets. The DB roles and
# grants are created by the db-bootstrap Job, as in uat and prod.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
  - serviceaccount.yaml
  - postgres.yaml
  - redis.yaml
  - networkpolicy.yaml
configMapGenerator:
  - name: redis-files
    files:
      - redis/redis.conf
      - redis/entrypoint.sh
