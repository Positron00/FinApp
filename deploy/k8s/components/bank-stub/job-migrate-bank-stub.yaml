# migrate-bank-stub-<version> (platform LLD §9.3): alembic upgrade head as bank_stub_migrator (C2), with the C1 keys.
# Named per version like base/migrations (nameSuffix there); test_k8s_policy.py keeps them in step.
apiVersion: batch/v1
kind: Job
metadata:
  name: migrate-bank-stub-0-1-0
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 604800
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bank-stub
        app.kubernetes.io/component: migration
        payrun.io/postgres-client: "true"
    spec:
      restartPolicy: Never
      serviceAccountName: payrun-jobs
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: migrate
          image: payrun/bank-stub:0.1.0
          imagePullPolicy: IfNotPresent
          command: ["alembic", "-c", "/app/alembic.ini", "upgrade", "head"]
          envFrom:
            - configMapRef: { name: payrun-env }
            - secretRef: { name: bank-stub-migrator }
          env:
            - { name: DB_USER, value: bank_stub_migrator }
            - { name: DB_SCHEMA, value: bank_stub }
            - { name: REDIS_HOST, value: "" } # bank-stub has no Redis
            - { name: OTEL_TRACES_SAMPLER, value: parentbased_always_on } # C23
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 384Mi }
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
      volumes: [{ name: tmp, emptyDir: { sizeLimit: 16Mi } }]
