apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web
spec:
  ingressClassName: nginx # the web NetworkPolicy admits the ingress-nginx namespace
  tls:
    - hosts: [payrun.example.com] # REPLACE: host (patched per overlay)
      secretName: web-tls
  rules:
    - host: payrun.example.com # REPLACE: host (patched per overlay)
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: web, port: { name: http } }
