apiVersion: v1
kind: ServiceAccount
metadata:
  name: mailpit
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  name: mailpit
spec:
  type: ClusterIP
  selector: { app.kubernetes.io/name: mailpit }
  ports:
    - { name: smtp, port: 1025, targetPort: smtp, protocol: TCP }
    - { name: http, port: 8025, targetPort: http, protocol: TCP }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mailpit
spec:
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels: { app.kubernetes.io/name: mailpit }
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mailpit
        app.kubernetes.io/component: mail
    spec:
      serviceAccountName: mailpit
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: mailpit
          image: axllent/mailpit:v1.32.0
          imagePullPolicy: IfNotPresent
          ports:
            - { name: smtp, containerPort: 1025 }
            - { name: http, containerPort: 8025 }
          env:
            - { name: MP_SMTP_AUTH_ACCEPT_ANY, value: "1" }
            - { name: MP_SMTP_AUTH_ALLOW_INSECURE, value: "1" }
            - { name: MP_MAX_MESSAGES, value: "5000" }
            - { name: MP_DATABASE, value: /tmp/mailpit.db }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          startupProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 2
            failureThreshold: 15
          livenessProbe:
            httpGet: { path: /livez, port: http }
            periodSeconds: 10
            timeoutSeconds: 2
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
            timeoutSeconds: 2
          resources:
            requests: { cpu: 20m, memory: 64Mi }
            limits: { memory: 256Mi }
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
      volumes: [{ name: tmp, emptyDir: { sizeLimit: 256Mi } }]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: mailpit
spec:
  maxUnavailable: 1
  selector:
    matchLabels: { app.kubernetes.io/name: mailpit }
---
# Mailpit ingress from identity on 1025 only (8025 is port-forward only).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mailpit
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: mailpit }
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels: { app.kubernetes.io/name: identity }
      ports: [{ protocol: TCP, port: 1025 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: identity-to-mailpit
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: identity }
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels: { app.kubernetes.io/name: mailpit }
      ports: [{ protocol: TCP, port: 1025 }]
