# prod sends mail through the provider (C49).
- op: add
  path: /spec/data/-
  value: { secretKey: SMTP_HOST, remoteRef: { key: payrun/ENV/SMTP_HOST } }
- op: add
  path: /spec/data/-
  value: { secretKey: SMTP_USERNAME, remoteRef: { key: payrun/ENV/SMTP_USERNAME } }
- op: add
  path: /spec/data/-
  value: { secretKey: SMTP_PASSWORD, remoteRef: { key: payrun/ENV/SMTP_PASSWORD } }
