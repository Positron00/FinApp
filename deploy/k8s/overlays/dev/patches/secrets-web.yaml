apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
spec:
  template:
    spec:
      containers:
        - name: web
          env:
            - name: INTERNAL_JWT_PRIVATE_KEY
              valueFrom:
                { secretKeyRef: { name: payrun-dev-secrets, key: INTERNAL_JWT_PRIVATE_KEY } }
            - name: INTERNAL_JWT_KID
              valueFrom: { secretKeyRef: { name: payrun-dev-secrets, key: INTERNAL_JWT_KID } }
            - name: REDIS_PASSWORD
              valueFrom: { secretKeyRef: { name: payrun-dev-secrets, key: REDIS_WEB_PASSWORD } }
            - name: SESSION_SECRET
              valueFrom: { secretKeyRef: { name: payrun-dev-secrets, key: SESSION_SECRET } }
