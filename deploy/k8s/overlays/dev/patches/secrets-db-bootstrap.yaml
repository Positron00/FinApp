apiVersion: batch/v1
kind: Job
metadata:
  name: db-bootstrap
spec:
  template:
    spec:
      containers:
        - name: db-bootstrap
          env:
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: payrun-dev-secrets, key: POSTGRES_PASSWORD } }
            - name: PGPASSWORD
              valueFrom: { secretKeyRef: { name: payrun-dev-secrets, key: POSTGRES_PASSWORD } }
            - name: IDENTITY_DB_MIGRATOR_PASSWORD
              valueFrom:
                { secretKeyRef: { name: payrun-dev-secrets, key: IDENTITY_DB_MIGRATOR_PASSWORD } }
            - name: IDENTITY_DB_PASSWORD
              valueFrom: { secretKeyRef: { name: payrun-dev-secrets, key: IDENTITY_DB_PASSWORD } }
            - name: PAYROLL_DB_MIGRATOR_PASSWORD
              valueFrom:
                { secretKeyRef: { name: payrun-dev-secrets, key: PAYROLL_DB_MIGRATOR_PASSWORD } }
            - name: PAYROLL_DB_PASSWORD
              valueFrom: { secretKeyRef: { name: payrun-dev-secrets, key: PAYROLL_DB_PASSWORD } }
            - name: PAYOUTS_DB_MIGRATOR_PASSWORD
              valueFrom:
                { secretKeyRef: { name: payrun-dev-secrets, key: PAYOUTS_DB_MIGRATOR_PASSWORD } }
            - name: PAYOUTS_DB_PASSWORD
              valueFrom: { secretKeyRef: { name: payrun-dev-secrets, key: PAYOUTS_DB_PASSWORD } }
            - name: BANK_STUB_DB_MIGRATOR_PASSWORD
              valueFrom:
                { secretKeyRef: { name: payrun-dev-secrets, key: BANK_STUB_DB_MIGRATOR_PASSWORD } }
            - name: BANK_STUB_DB_PASSWORD
              valueFrom: { secretKeyRef: { name: payrun-dev-secrets, key: BANK_STUB_DB_PASSWORD } }
            - name: POSTGRES_EXPORTER_PASSWORD
              valueFrom:
                { secretKeyRef: { name: payrun-dev-secrets, key: POSTGRES_EXPORTER_PASSWORD } }
