apiVersion: apps/v1
kind: Deployment
metadata:
  name: payout-worker
spec:
  template:
    spec:
      containers:
        - name: payout-worker
          env:
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: payrun-dev-secrets, key: PAYOUTS_DB_PASSWORD } }
            - name: REDIS_PASSWORD
              valueFrom:
                { secretKeyRef: { name: payrun-dev-secrets, key: REDIS_PAYOUT_WORKER_PASSWORD } }
            - name: PAYOUT_WORKER_JWT_PRIVATE_KEY
              valueFrom:
                { secretKeyRef: { name: payrun-dev-secrets, key: PAYOUT_WORKER_JWT_PRIVATE_KEY } }
            - name: PAYOUT_WORKER_JWT_KID
              valueFrom: { secretKeyRef: { name: payrun-dev-secrets, key: PAYOUT_WORKER_JWT_KID } }
            - name: BANK_STUB_API_KEY
              valueFrom: { secretKeyRef: { name: payrun-dev-secrets, key: BANK_STUB_API_KEY } }
