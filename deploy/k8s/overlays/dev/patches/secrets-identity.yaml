apiVersion: apps/v1
kind: Deployment
metadata:
  name: identity
spec:
  template:
    spec:
      containers:
        - name: identity
          env:
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: payrun-dev-secrets, key: IDENTITY_DB_PASSWORD } }
            - name: REDIS_PASSWORD
              valueFrom:
                { secretKeyRef: { name: payrun-dev-secrets, key: REDIS_IDENTITY_PASSWORD } }
            - name: AUDIT_IP_HASH_KEY
              valueFrom: { secretKeyRef: { name: payrun-dev-secrets, key: AUDIT_IP_HASH_KEY } }
            - name: INTERNAL_JWT_PUBLIC_KEYS
              valueFrom:
                {
                  secretKeyRef:
                    { name: payrun-dev-secrets, key: IDENTITY_INTERNAL_JWT_PUBLIC_KEYS },
                }
