apiVersion: apps/v1
kind: Deployment
metadata:
  name: payroll
spec:
  template:
    spec:
      containers:
        - name: payroll
          env:
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: payrun-dev-secrets, key: PAYROLL_DB_PASSWORD } }
            - name: REDIS_PASSWORD
              valueFrom: { secretKeyRef: { name: payrun-dev-secrets, key: REDIS_PAYROLL_PASSWORD } }
            - name: PAYROLL_FIELD_KEYS
              valueFrom: { secretKeyRef: { name: payrun-dev-secrets, key: PAYROLL_FIELD_KEYS } }
            - name: PAYROLL_FIELD_ACTIVE_KID
              valueFrom:
                { secretKeyRef: { name: payrun-dev-secrets, key: PAYROLL_FIELD_ACTIVE_KID } }
            - name: INTERNAL_JWT_PUBLIC_KEYS
              valueFrom:
                {
                  secretKeyRef: { name: payrun-dev-secrets, key: PAYROLL_INTERNAL_JWT_PUBLIC_KEYS },
                }
