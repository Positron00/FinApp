apiVersion: apps/v1
kind: Deployment
metadata:
  name: bank-stub
spec:
  template:
    spec:
      containers:
        - name: bank-stub
          env:
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: payrun-dev-secrets, key: BANK_STUB_DB_PASSWORD } }
            - name: BANK_STUB_API_KEY
              valueFrom: { secretKeyRef: { name: payrun-dev-secrets, key: BANK_STUB_API_KEY } }
