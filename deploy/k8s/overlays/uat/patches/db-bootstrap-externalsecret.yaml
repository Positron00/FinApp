# uat keeps the bank_stub schema, so the bootstrap needs its role passwords too.
- op: add
  path: /spec/data/-
  value:
    {
      secretKey: BANK_STUB_DB_MIGRATOR_PASSWORD,
      remoteRef: { key: payrun/ENV/BANK_STUB_DB_MIGRATOR_PASSWORD },
    }
- op: add
  path: /spec/data/-
  value: { secretKey: BANK_STUB_DB_PASSWORD, remoteRef: { key: payrun/ENV/BANK_STUB_DB_PASSWORD } }
