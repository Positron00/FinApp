# The Collector's only egress: the telemetry backend over TLS (platform LLD §9.4; ADR 0011).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: otel-collector-egress
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: otel-collector }
  policyTypes: [Egress]
  egress:
    - to:
        - ipBlock: { cidr: 198.51.100.0/28 } # REPLACE: telemetry backend subnet
      ports: [{ protocol: TCP, port: 443 }]
