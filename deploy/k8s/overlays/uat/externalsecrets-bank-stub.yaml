# bank-stub's secrets in uat (prod has no bank-stub; platform LLD §9.6).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: bank-stub-secrets
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: payrun-secrets }
  target: { name: bank-stub-secrets, creationPolicy: Owner }
  data:
    - { secretKey: DB_PASSWORD, remoteRef: { key: payrun/ENV/BANK_STUB_DB_PASSWORD } }
    - { secretKey: BANK_STUB_API_KEY, remoteRef: { key: payrun/ENV/BANK_STUB_API_KEY } }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: bank-stub-migrator
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: payrun-secrets }
  target: { name: bank-stub-migrator, creationPolicy: Owner }
  data:
    - { secretKey: DB_PASSWORD, remoteRef: { key: payrun/ENV/BANK_STUB_DB_MIGRATOR_PASSWORD } }
