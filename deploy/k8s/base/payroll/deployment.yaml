# payroll (payroll LLD; PAY-200..411).
# Pod security per platform LLD §9.2: non-root, read-only root filesystem, no capabilities,
# RuntimeDefault seccomp, no service-account token, /tmp on an emptyDir.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payroll
spec:
  replicas: 1 # overlays set it
  revisionHistoryLimit: 5
  strategy: { type: RollingUpdate, rollingUpdate: { maxUnavailable: 0, maxSurge: 1 } }
  selector:
    matchLabels: { app.kubernetes.io/name: payroll }
  template:
    metadata:
      labels:
        app.kubernetes.io/name: payroll
        app.kubernetes.io/component: api
        payrun.io/postgres-client: "true"
        payrun.io/redis-client: "true"
    spec:
      serviceAccountName: payroll
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: payroll
          image: payrun/payroll:0.1.0
          imagePullPolicy: IfNotPresent
          ports: [{ name: http, containerPort: 8000 }]
          envFrom:
            - configMapRef: { name: payrun-env }
            - configMapRef: { name: payout-timing }
            - configMapRef: { name: payroll-config }
            - secretRef: { name: payroll-secrets }
          env:
            - { name: OTEL_SEMCONV_STABILITY_OPT_IN, value: http }
            - { name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "http://otel-collector:4317" }
            - { name: OTEL_EXPORTER_OTLP_TIMEOUT, value: "3" } # seconds (Python gRPC exporter); bounds shutdown flush (C67)
            - { name: OTEL_TRACES_SAMPLER, value: parentbased_always_on } # C23, every overlay
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          startupProbe: # 30 s
            httpGet: { path: /livez, port: http }
            periodSeconds: 2
            failureThreshold: 15
          livenessProbe:
            httpGet: { path: /livez, port: http }
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests: { cpu: 100m, memory: 192Mi }
            limits: { memory: 384Mi } # no CPU limit
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
      volumes: [{ name: tmp, emptyDir: { sizeLimit: 64Mi } }]
