# OTel Collector: OTLP in on 4317/4318, app metrics out on 8889 for the cluster's Prometheus.
# The image runs as 10001; same pod security as the services.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
spec:
  replicas: 1 # overlays set it
  revisionHistoryLimit: 5
  strategy: { type: RollingUpdate, rollingUpdate: { maxUnavailable: 0, maxSurge: 1 } }
  selector:
    matchLabels: { app.kubernetes.io/name: otel-collector }
  template:
    metadata:
      labels:
        app.kubernetes.io/name: otel-collector
        app.kubernetes.io/component: telemetry
    spec:
      serviceAccountName: otel-collector
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: otel-collector
          image: otel/opentelemetry-collector-contrib:0.164.0
          imagePullPolicy: IfNotPresent
          args: ["--config=/etc/otelcol-contrib/collector.yaml"]
          ports:
            - { name: otlp-grpc, containerPort: 4317 }
            - { name: otlp-http, containerPort: 4318 }
            - { name: metrics, containerPort: 8889 }
            - { name: self-metrics, containerPort: 8888 }
            - { name: health, containerPort: 13133 }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          startupProbe:
            httpGet: { path: /, port: health }
            periodSeconds: 2
            failureThreshold: 15
          livenessProbe:
            httpGet: { path: /, port: health }
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /, port: health }
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 512Mi } # memory_limiter keeps it at 80% of this
          volumeMounts:
            - { name: config, mountPath: /etc/otelcol-contrib, readOnly: true }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: config
          configMap:
            name: otel-collector-config
            items: [{ key: collector.yaml, path: collector.yaml }]
        - { name: tmp, emptyDir: { sizeLimit: 64Mi } }
