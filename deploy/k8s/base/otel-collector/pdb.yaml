# maxUnavailable 1: the Collector is a single-replica gateway in every overlay (platform LLD §8.1, §9.2),
# so a node drain may evict it (minAvailable 1 would block every drain). A PDB doesn't gate the
# Deployment's own Recreate rollouts.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: otel-collector
spec:
  maxUnavailable: 1
  selector:
    matchLabels: { app.kubernetes.io/name: otel-collector }
