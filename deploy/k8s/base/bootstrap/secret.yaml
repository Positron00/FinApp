# The bootstrap admin's password and every role password, under their .env names (the init SQL
# reads them with \getenv; platform LLD §2.1). Placeholders only: dev maps its generated secret
# over them and uat/prod replace this Secret with an ExternalSecret (§9.6).
apiVersion: v1
kind: Secret
metadata:
  name: db-bootstrap
type: Opaque
stringData:
  POSTGRES_PASSWORD: REPLACE_ME
  IDENTITY_DB_MIGRATOR_PASSWORD: REPLACE_ME
  IDENTITY_DB_PASSWORD: REPLACE_ME
  PAYROLL_DB_MIGRATOR_PASSWORD: REPLACE_ME
  PAYROLL_DB_PASSWORD: REPLACE_ME
  PAYOUTS_DB_MIGRATOR_PASSWORD: REPLACE_ME
  PAYOUTS_DB_PASSWORD: REPLACE_ME
  BANK_STUB_DB_MIGRATOR_PASSWORD: REPLACE_ME
  BANK_STUB_DB_PASSWORD: REPLACE_ME
  POSTGRES_EXPORTER_PASSWORD: REPLACE_ME
