# bootstrap Jobs (platform LLD §9.4): no ingress; egress only to Postgres, which the overlay's data
# component allows for every pod labelled payrun.io/postgres-client (in-cluster or managed ipBlock).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: bootstrap
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/component: bootstrap }
  policyTypes: [Ingress, Egress]
