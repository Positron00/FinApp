# promtool test rules tests/alerts_test.yml (platform LLD §8.3; PAY-NFR-04, 10, 11). Run from this
# folder. Every alert in rules/alerts.yml has at least one case that fires (exp_alerts with its full
# labels and annotations) and one that stays quiet (exp_alerts: []); tests/platform/test_rules_meta.py
# enforces this. PodRestarts (Kubernetes only) is tested in deploy/k8s/observability.
rule_files: [../rules/recording.yml, ../rules/alerts.yml]
evaluation_interval: 30s
tests:
  # ------------------------------------------------------------------ BffAvailabilityFastBurn (page)
  - name: BffAvailabilityFastBurn fires at 10% errors for 70 minutes
    interval: 1m
    input_series:
      - series: 'bff_request_duration_seconds_count{route="/api/pay-runs", status="200"}'
        values: "0+90x70"
      - series: 'bff_request_duration_seconds_count{route="/api/pay-runs", status="500"}'
        values: "0+10x70"
    alert_rule_test:
      - alertname: BffAvailabilityFastBurn
        eval_time: 65m
        exp_alerts:
          - exp_labels: { severity: page, service_name: web, slo: bff-availability }
            exp_annotations:
              summary: "The BFF is burning its 30-day error budget 14.4x too fast"
              description: "10% of BFF requests failed with 5xx over the last hour and 5 minutes. Check the Journeys dashboard for the failing route, then its service's error traces."
              runbook_url: "https://github.com/Positron00/FinApp/blob/main/docs/runbooks/BffAvailabilityFastBurn.md"
              dashboard_url: "http://127.0.0.1:4101/d/payrun-journeys"
  - name: BffAvailabilityFastBurn stays quiet at 5% errors (below 14.4 x 0.005 = 0.072)
    interval: 1m
    input_series:
      - series: 'bff_request_duration_seconds_count{route="/api/pay-runs", status="200"}'
        values: "0+95x70"
      - series: 'bff_request_duration_seconds_count{route="/api/pay-runs", status="500"}'
        values: "0+5x70"
    alert_rule_test:
      - alertname: BffAvailabilityFastBurn
        eval_time: 65m
        exp_alerts: []
  - name: BffAvailabilityFastBurn stays quiet on a 4-minute spike (5 m window high, 1 h window low)
    interval: 1m
    input_series:
      - series: 'bff_request_duration_seconds_count{route="/api/pay-runs", status="200"}'
        values: "0+100x70"
      - series: 'bff_request_duration_seconds_count{route="/api/pay-runs", status="500"}'
        values: "0x60 100 200 300 400 400x6"
    alert_rule_test:
      - alertname: BffAvailabilityFastBurn
        eval_time: 64m
        exp_alerts: []
      - alertname: BffAvailabilityFastBurn
        eval_time: 66m
        exp_alerts: []
  - name: BffAvailabilityFastBurn stays quiet when only health routes fail (C4)
    interval: 1m
    input_series:
      - series: 'bff_request_duration_seconds_count{route="/api/pay-runs", status="200"}'
        values: "0+90x70"
      - series: 'bff_request_duration_seconds_count{route="/api/readyz", status="503"}'
        values: "0+50x70"
      - series: 'bff_request_duration_seconds_count{route="/api/livez", status="500"}'
        values: "0+50x70"
      - series: 'bff_request_duration_seconds_count{route="/api/telemetry", status="500"}'
        values: "0+50x70"
    alert_rule_test:
      - alertname: BffAvailabilityFastBurn
        eval_time: 65m
        exp_alerts: []

  # ------------------------------------------------------------------ BffAvailabilitySlowBurn (ticket)
  - name: BffAvailabilitySlowBurn fires at 4% errors for 7 hours (above 6 x 0.005 = 0.03)
    interval: 1m
    input_series:
      - series: 'bff_request_duration_seconds_count{route="/api/employees", status="200"}'
        values: "0+96x420"
      - series: 'bff_request_duration_seconds_count{route="/api/employees", status="502"}'
        values: "0+4x420"
    alert_rule_test:
      - alertname: BffAvailabilitySlowBurn
        eval_time: 7h
        exp_alerts:
          - exp_labels: { severity: ticket, service_name: web, slo: bff-availability }
            exp_annotations:
              summary: "The BFF is burning its 30-day error budget 6x too fast"
              description: "4% of BFF requests failed with 5xx over the last 6 hours. Find the route with the highest 5xx ratio on the Journeys dashboard."
              runbook_url: "https://github.com/Positron00/FinApp/blob/main/docs/runbooks/BffAvailabilitySlowBurn.md"
              dashboard_url: "http://127.0.0.1:4101/d/payrun-journeys"
  - name: BffAvailabilitySlowBurn stays quiet at 2% errors for 7 hours
    interval: 1m
    input_series:
      - series: 'bff_request_duration_seconds_count{route="/api/employees", status="200"}'
        values: "0+98x420"
      - series: 'bff_request_duration_seconds_count{route="/api/employees", status="500"}'
        values: "0+2x420"
    alert_rule_test:
      - alertname: BffAvailabilitySlowBurn
        eval_time: 7h
        exp_alerts: []
  - name: BffAvailabilitySlowBurn stays quiet with no traffic (0/0 is NaN, which compares false)
    interval: 1m
    input_series:
      - series: 'bff_request_duration_seconds_count{route="/api/employees", status="500"}'
        values: "0x420"
    alert_rule_test:
      - alertname: BffAvailabilitySlowBurn
        eval_time: 7h
        exp_alerts: []

  # ------------------------------------------------------------------ PayoutSettlementSlow (page)
  - name: PayoutSettlementSlow fires when the oldest processing run is 90 s old for more than 2 minutes
    interval: 1m
    input_series:
      - series: 'payroll_runs_processing_oldest_age_seconds{service_name="payroll"}'
        values: "0 0 90x10"
    alert_rule_test:
      - alertname: PayoutSettlementSlow
        eval_time: 6m
        exp_alerts:
          - exp_labels: { severity: page, service_name: payroll }
            exp_annotations:
              summary: "A pay run has been processing for more than 60 seconds"
              description: "The oldest processing run is 1m 30s old. Check payout-worker health, consumer lag and the bank dependency."
              runbook_url: "https://github.com/Positron00/FinApp/blob/main/docs/runbooks/PayoutSettlementSlow.md"
              dashboard_url: "http://127.0.0.1:4101/d/payrun-queues"
  - name: PayoutSettlementSlow stays quiet at 45 s, and on 90 s for one minute only
    interval: 1m
    input_series:
      - series: 'payroll_runs_processing_oldest_age_seconds{service_name="payroll", instance="a"}'
        values: "45x30"
      - series: 'payroll_runs_processing_oldest_age_seconds{service_name="payroll", instance="b"}'
        values: "0 0 90 0x27"
    alert_rule_test:
      - alertname: PayoutSettlementSlow
        eval_time: 5m
        exp_alerts: []
      - alertname: PayoutSettlementSlow
        eval_time: 30m
        exp_alerts: []

  # ------------------------------------------------------------------ PayoutDLQ (page)
  - name: PayoutDLQ fires on a pre-initialised counter (C21)
    interval: 1m
    input_series:
      - series: 'queue_messages_total{service_name="payout-worker", stream="stream:payout.requested", outcome="dlq"}'
        values: "0 0 0 1 1 1 1 1"
    alert_rule_test:
      - alertname: PayoutDLQ
        eval_time: 5m
        exp_alerts:
          - exp_labels:
              severity: page
              service_name: payout-worker
              stream: stream:payout.requested
              outcome: dlq
            exp_annotations:
              summary: "Payout messages were dead-lettered in the last 15 minutes"
              description: "1 message(s) moved to stream:payout.requested.dlq. Money may be stuck: follow the DLQ replay steps."
              runbook_url: "https://github.com/Positron00/FinApp/blob/main/docs/runbooks/PayoutDLQ.md"
              dashboard_url: "http://127.0.0.1:4101/d/payrun-queues"
  - name: PayoutDLQ stays quiet when flat or on retries, and misses a series that first appears at 1 (pitfall)
    interval: 1m
    input_series:
      - series: 'queue_messages_total{service_name="payout-worker", stream="a", outcome="dlq"}'
        values: "0 0 0 0 0 0"
      - series: 'queue_messages_total{service_name="payout-worker", stream="a", outcome="retry"}'
        values: "0 1 2 3 4 5"
      - series: 'queue_messages_total{service_name="payout-worker", stream="b", outcome="dlq"}'
        values: "_ _ _ 1 1 1"
    alert_rule_test:
      - alertname: PayoutDLQ
        eval_time: 5m
        exp_alerts: []

  # ------------------------------------------------------------------ PayoutNeedsOperator (page)
  - name: PayoutNeedsOperator fires when one replica reports an attempt waiting (max over replicas)
    interval: 1m
    input_series:
      - series: 'payroll_attempts_needs_operator{service_name="payroll", instance="a"}'
        values: "0x5"
      - series: 'payroll_attempts_needs_operator{service_name="payroll", instance="b"}'
        values: "0 1x4"
    alert_rule_test:
      - alertname: PayoutNeedsOperator
        eval_time: 3m
        exp_alerts:
          - exp_labels: { severity: page, service_name: payroll }
            exp_annotations:
              summary: "Payout attempts need an operator decision"
              description: "1 payout attempt(s) are blocked in needs_operator. Check the bank for each before choosing Send again or Mark rejected."
              runbook_url: "https://github.com/Positron00/FinApp/blob/main/docs/runbooks/PayoutNeedsOperator.md"
              dashboard_url: "http://127.0.0.1:4101/d/payrun-queues"
  - name: PayoutNeedsOperator stays quiet at 0
    interval: 1m
    input_series:
      - series: 'payroll_attempts_needs_operator{service_name="payroll"}'
        values: "0x10"
    alert_rule_test:
      - alertname: PayoutNeedsOperator
        eval_time: 10m
        exp_alerts: []

  # ------------------------------------------------------------------ PayoutLateSettlement (page)
  - name: PayoutLateSettlement pages on the first late settlement (pre-initialised counter, PAY-NFR-02)
    interval: 1m
    input_series:
      - series: 'payroll_late_settlements_total{service_name="payroll"}'
        values: "0 0 0 1 1 1 1 1"
    alert_rule_test:
      - alertname: PayoutLateSettlement
        eval_time: 5m
        exp_alerts:
          - exp_labels:
              severity: page
              service_name: payroll
            exp_annotations:
              summary: "The bank settled a payout attempt that payroll had already rejected or replaced"
              description: "1 late settled answer(s) in the last 15 minutes: an employee may have been paid twice. Find the payout.late_settlement audit row, check the bank for every attempt's key, then recall or record."
              runbook_url: "https://github.com/Positron00/FinApp/blob/main/docs/runbooks/PayoutLateSettlement.md"
              dashboard_url: "http://127.0.0.1:4101/d/payrun-queues"
  - name: PayoutLateSettlement stays quiet while the counter is flat, and clears after 15 minutes
    interval: 1m
    input_series:
      - series: 'payroll_late_settlements_total{service_name="payroll"}'
        values: "0x10 1x30"
    alert_rule_test:
      - alertname: PayoutLateSettlement
        eval_time: 9m
        exp_alerts: []
      - alertname: PayoutLateSettlement
        eval_time: 30m
        exp_alerts: []

  # ------------------------------------------------------------------ PayoutsStuck (page)
  - name: PayoutsStuck fires after 10 minutes of stuck attempts
    interval: 1m
    input_series:
      - series: 'payroll_payouts_stuck{service_name="payroll"}'
        values: "2x15"
    alert_rule_test:
      - alertname: PayoutsStuck
        eval_time: 12m
        exp_alerts:
          - exp_labels: { severity: page, service_name: payroll }
            exp_annotations:
              summary: "Payouts are stuck without progress"
              description: "2 payout(s) have had no result for longer than PAYOUT_STUCK_AFTER_S. Check the worker, the stream and re-publish counts."
              runbook_url: "https://github.com/Positron00/FinApp/blob/main/docs/runbooks/PayoutsStuck.md"
              dashboard_url: "http://127.0.0.1:4101/d/payrun-queues"
  - name: PayoutsStuck stays quiet when the attempts recover within 10 minutes
    interval: 1m
    input_series:
      - series: 'payroll_payouts_stuck{service_name="payroll"}'
        values: "2x8 0x10"
    alert_rule_test:
      - alertname: PayoutsStuck
        eval_time: 8m
        exp_alerts: []
      - alertname: PayoutsStuck
        eval_time: 12m
        exp_alerts: []

  # ------------------------------------------------------------------ PayoutStreamNearMaxlen (warning)
  - name: PayoutStreamNearMaxlen fires above 80% of STREAM_MAXLEN for 5 minutes
    interval: 1m
    input_series:
      - series: 'redis_stream_length{job="redis", stream="stream:payout.requested"}'
        values: "85000x10"
    alert_rule_test:
      - alertname: PayoutStreamNearMaxlen
        eval_time: 7m
        exp_alerts:
          - exp_labels: { severity: warning, service_name: redis }
            exp_annotations:
              summary: "The payout stream is above 80% of STREAM_MAXLEN"
              description: "stream:payout.requested holds 85000 entries; trimming past 100000 would drop unread messages. Check consumer health and lag."
              runbook_url: "https://github.com/Positron00/FinApp/blob/main/docs/runbooks/PayoutStreamNearMaxlen.md"
              dashboard_url: "http://127.0.0.1:4101/d/payrun-queues"
  - name: PayoutStreamNearMaxlen stays quiet at 79000, and ignores the DLQ stream
    interval: 1m
    input_series:
      - series: 'redis_stream_length{job="redis", stream="stream:payout.requested"}'
        values: "79000x10"
      - series: 'redis_stream_length{job="redis", stream="stream:payout.requested.dlq"}'
        values: "95000x10"
    alert_rule_test:
      - alertname: PayoutStreamNearMaxlen
        eval_time: 7m
        exp_alerts: []

  # ------------------------------------------------------------------ EmailOutboxStuck (warning)
  - name: EmailOutboxStuck fires when the oldest pending email is older than 15 minutes
    interval: 1m
    input_series:
      - series: 'identity_email_oldest_pending_age_seconds{service_name="identity"}'
        values: "1000x10"
      - series: 'identity_emails_failed_total{service_name="identity"}'
        values: "0x10"
    alert_rule_test:
      - alertname: EmailOutboxStuck
        eval_time: 7m
        exp_alerts:
          - exp_labels: { severity: warning, service_name: identity }
            exp_annotations:
              summary: "Identity emails are stuck or failing"
              description: "The oldest pending email is old, or emails failed permanently in the last hour (1000). Check SMTP connectivity and identity logs."
              runbook_url: "https://github.com/Positron00/FinApp/blob/main/docs/runbooks/EmailOutboxStuck.md"
              dashboard_url: "http://127.0.0.1:4101/d/payrun-service-overview"
  - name: EmailOutboxStuck fires 5 minutes after a permanent failure (counter 0 -> 1, R25, C20)
    interval: 1m
    input_series:
      - series: 'identity_email_oldest_pending_age_seconds{service_name="identity"}'
        values: "0x10"
      - series: 'identity_emails_failed_total{service_name="identity"}'
        values: "0 0 1x10"
    alert_rule_test:
      - alertname: EmailOutboxStuck
        eval_time: 4m
        exp_alerts: []
      - alertname: EmailOutboxStuck
        eval_time: 8m
        exp_alerts:
          - exp_labels: { severity: warning, service_name: identity }
            exp_annotations:
              summary: "Identity emails are stuck or failing"
              description: "The oldest pending email is old, or emails failed permanently in the last hour (1). Check SMTP connectivity and identity logs."
              runbook_url: "https://github.com/Positron00/FinApp/blob/main/docs/runbooks/EmailOutboxStuck.md"
              dashboard_url: "http://127.0.0.1:4101/d/payrun-service-overview"
  - name: EmailOutboxStuck stays quiet at 300 s with a flat counter, and clears 1 h after the last failure
    interval: 1m
    input_series:
      - series: 'identity_email_oldest_pending_age_seconds{service_name="identity"}'
        values: "300x130"
      - series: 'identity_emails_failed_total{service_name="identity"}'
        values: "0x60 1x70"
    alert_rule_test:
      - alertname: EmailOutboxStuck
        eval_time: 30m
        exp_alerts: []
      - alertname: EmailOutboxStuck
        eval_time: 125m
        exp_alerts: []

  # ------------------------------------------------------------------ RateLimiterErrors (warning)
  - name: RateLimiterErrors fires when a limiter keeps failing for 5 minutes
    interval: 1m
    input_series:
      - series: 'rate_limiter_errors_total{service_name="identity", component="login"}'
        values: "0+3x15"
    alert_rule_test:
      - alertname: RateLimiterErrors
        eval_time: 10m
        exp_alerts:
          - exp_labels: { severity: warning, service_name: identity, component: login }
            exp_annotations:
              summary: "The rate limiter in identity is failing"
              description: "Rate-limiter errors in login (0.05/s). Check Redis reachability from that service."
              runbook_url: "https://github.com/Positron00/FinApp/blob/main/docs/runbooks/RateLimiterErrors.md"
              dashboard_url: "http://127.0.0.1:4101/d/payrun-service-overview"
  - name: RateLimiterErrors stays quiet on the pre-initialised flat counter
    interval: 1m
    input_series:
      - series: 'rate_limiter_errors_total{service_name="identity", component="login"}'
        values: "0x15"
      - series: 'rate_limiter_errors_total{service_name="web", component="web"}'
        values: "0x15"
    alert_rule_test:
      - alertname: RateLimiterErrors
        eval_time: 10m
        exp_alerts: []

  # ------------------------------------------------------------------ OutboxStuck (warning)
  - name: OutboxStuck fires when the oldest unsent row is 2 minutes old for a minute
    interval: 1m
    input_series:
      - series: 'outbox_oldest_age_seconds{service_name="payroll"}'
        values: "120x5"
    alert_rule_test:
      - alertname: OutboxStuck
        eval_time: 3m
        exp_alerts:
          - exp_labels: { severity: warning, service_name: payroll }
            exp_annotations:
              summary: "The payroll outbox is not draining"
              description: "The oldest unsent outbox row is 2m 0s old. Check the relay and Redis."
              runbook_url: "https://github.com/Positron00/FinApp/blob/main/docs/runbooks/OutboxStuck.md"
              dashboard_url: "http://127.0.0.1:4101/d/payrun-queues"
  - name: OutboxStuck stays quiet at 20 s
    interval: 1m
    input_series:
      - series: 'outbox_oldest_age_seconds{service_name="payroll"}'
        values: "20x5"
    alert_rule_test:
      - alertname: OutboxStuck
        eval_time: 3m
        exp_alerts: []

  # ------------------------------------------------------------------ ConsumerLagGrowing (warning)
  - name: ConsumerLagGrowing fires when lag rises steadily from 0 to 500 over 25 minutes
    interval: 1m
    input_series:
      - series: 'queue_consumer_lag{service_name="payout-worker", stream="stream:payout.requested", group="payout-worker"}'
        values: "0+20x25"
    alert_rule_test:
      - alertname: ConsumerLagGrowing
        eval_time: 20m
        exp_alerts:
          - exp_labels:
              severity: warning
              service_name: payout-worker
              stream: stream:payout.requested
              group: payout-worker
            exp_annotations:
              summary: "Consumer lag on stream:payout.requested keeps growing"
              description: "Group payout-worker is falling behind. Check worker health, concurrency and bank latency."
              runbook_url: "https://github.com/Positron00/FinApp/blob/main/docs/runbooks/ConsumerLagGrowing.md"
              dashboard_url: "http://127.0.0.1:4101/d/payrun-queues"
  - name: ConsumerLagGrowing stays quiet when a 500-message burst drains within 2 minutes
    interval: 1m
    input_series:
      - series: 'queue_consumer_lag{service_name="payout-worker", stream="stream:payout.requested", group="payout-worker"}'
        values: "0 0 500 250 0x20"
    alert_rule_test:
      - alertname: ConsumerLagGrowing
        eval_time: 15m
        exp_alerts: []

  # ------------------------------------------------------------------ BankBreakerOpen (warning)
  - name: BankBreakerOpen fires when the bank breaker stays open for 5 minutes
    interval: 1m
    input_series:
      - series: 'circuit_breaker_state{service_name="payout-worker", target="bank"}'
        values: "0 2x8"
    alert_rule_test:
      - alertname: BankBreakerOpen
        eval_time: 7m
        exp_alerts:
          - exp_labels: { severity: warning, service_name: payout-worker }
            exp_annotations:
              summary: "The bank circuit breaker has been open for 5 minutes"
              description: "Calls to the bank fail fast. Check the bank dependency dashboard and the bank's status."
              runbook_url: "https://github.com/Positron00/FinApp/blob/main/docs/runbooks/BankBreakerOpen.md"
              dashboard_url: "http://127.0.0.1:4101/d/payrun-bank"
  - name: BankBreakerOpen stays quiet on a 3-minute opening, on half-open, and on other targets
    interval: 1m
    input_series:
      - series: 'circuit_breaker_state{service_name="payout-worker", target="bank", instance="a"}'
        values: "2x3 0x5"
      - series: 'circuit_breaker_state{service_name="payout-worker", target="bank", instance="b"}'
        values: "1x9"
      - series: 'circuit_breaker_state{service_name="web", target="identity"}'
        values: "2x9"
    alert_rule_test:
      - alertname: BankBreakerOpen
        eval_time: 8m
        exp_alerts: []

  # ------------------------------------------------------------------ BankErrorRateHigh (warning)
  - name: BankErrorRateHigh fires at 10% timeouts for 15 minutes
    interval: 1m
    input_series:
      - series: 'external_requests_total{service_name="payout-worker", provider="bank", operation="create_transfer", outcome="ok"}'
        values: "0+90x20"
      - series: 'external_requests_total{service_name="payout-worker", provider="bank", operation="create_transfer", outcome="timeout"}'
        values: "0+10x20"
    alert_rule_test:
      - alertname: BankErrorRateHigh
        eval_time: 16m
        exp_alerts:
          - exp_labels: { severity: warning, service_name: payout-worker, provider: bank }
            exp_annotations:
              summary: "More than 5% of bank calls fail"
              description: "10% of bank calls failed at the transport or HTTP level (business rejections are not counted)."
              runbook_url: "https://github.com/Positron00/FinApp/blob/main/docs/runbooks/BankErrorRateHigh.md"
              dashboard_url: "http://127.0.0.1:4101/d/payrun-bank"
  - name: BankErrorRateHigh stays quiet at 4% errors, on business rejections, and on other providers
    interval: 1m
    input_series:
      - series: 'external_requests_total{service_name="payout-worker", provider="bank", operation="create_transfer", outcome="ok"}'
        values: "0+96x20"
      - series: 'external_requests_total{service_name="payout-worker", provider="bank", operation="create_transfer", outcome="server_error"}'
        values: "0+4x20"
      - series: 'payouts_bank_transfers_total{service_name="payout-worker", outcome="rejected", reason="account_closed"}'
        values: "0+50x20"
      - series: 'external_requests_total{service_name="identity", provider="smtp", operation="send", outcome="connect_error"}'
        values: "0+10x20"
    alert_rule_test:
      - alertname: BankErrorRateHigh
        eval_time: 16m
        exp_alerts: []

  # ------------------------------------------------------------------ SigninFailuresSpike (warning)
  - name: SigninFailuresSpike fires on 60 failed sign-ins in 15 minutes
    interval: 1m
    input_series:
      - series: 'auth_signins_total{service_name="identity", outcome="failure"}'
        values: "0+4x20"
    alert_rule_test:
      - alertname: SigninFailuresSpike
        eval_time: 16m
        exp_alerts:
          - exp_labels: { severity: warning, service_name: identity }
            exp_annotations:
              summary: "Many failed sign-ins in the last 15 minutes"
              description: "60 failed sign-ins in 15 minutes. Check the auth audit log for a credential-stuffing pattern."
              runbook_url: "https://github.com/Positron00/FinApp/blob/main/docs/runbooks/SigninFailuresSpike.md"
              dashboard_url: "http://127.0.0.1:4101/d/payrun-service-overview"
  - name: SigninFailuresSpike stays quiet at 30 failures, and counts neither success nor rate_limited (C19)
    interval: 1m
    input_series:
      - series: 'auth_signins_total{service_name="identity", outcome="failure"}'
        values: "0+2x20"
      - series: 'auth_signins_total{service_name="identity", outcome="success"}'
        values: "0+67x20"
      - series: 'auth_signins_total{service_name="identity", outcome="rate_limited"}'
        values: "0+7x20"
    alert_rule_test:
      - alertname: SigninFailuresSpike
        eval_time: 16m
        exp_alerts: []

  # ------------------------------------------------------------------ RedisMemoryHigh (warning)
  - name: RedisMemoryHigh fires at 90% of maxmemory for 6 minutes
    interval: 1m
    input_series:
      - series: 'redis_memory_used_bytes{job="redis", instance="redis-exporter:9121"}'
        values: "900x10"
      - series: 'redis_memory_max_bytes{job="redis", instance="redis-exporter:9121"}'
        values: "1000x10"
    alert_rule_test:
      - alertname: RedisMemoryHigh
        eval_time: 7m
        exp_alerts:
          - exp_labels: { severity: warning, service_name: redis }
            exp_annotations:
              summary: "Redis memory is above 80% of maxmemory"
              description: "Redis uses 90% of maxmemory with noeviction: writes will fail when it is full."
              runbook_url: "https://github.com/Positron00/FinApp/blob/main/docs/runbooks/RedisMemoryHigh.md"
              dashboard_url: "http://127.0.0.1:4101/d/payrun-platform"
  - name: RedisMemoryHigh stays quiet at 50%, and when maxmemory is 0 (no limit)
    interval: 1m
    input_series:
      - series: 'redis_memory_used_bytes{job="redis", instance="a"}'
        values: "500x10"
      - series: 'redis_memory_max_bytes{job="redis", instance="a"}'
        values: "1000x10"
      - series: 'redis_memory_used_bytes{job="redis", instance="b"}'
        values: "900x10"
      - series: 'redis_memory_max_bytes{job="redis", instance="b"}'
        values: "0x10"
    alert_rule_test:
      - alertname: RedisMemoryHigh
        eval_time: 7m
        exp_alerts: []

  # ------------------------------------------------------------------ CollectorDropping (warning)
  - name: CollectorDropping fires on Collector 0.164's unsuffixed send_failed counter
    interval: 1m
    input_series:
      - series: 'otelcol_exporter_send_failed_spans{exporter="otlp_grpc/tempo"}'
        values: "0+5x20"
    alert_rule_test:
      - alertname: CollectorDropping
        eval_time: 16m
        exp_alerts:
          - exp_labels: { severity: warning, service_name: otel-collector }
            exp_annotations:
              summary: "The OTel Collector is dropping telemetry"
              description: "Export or receive failures at 0.08333333333333333/s. Check Tempo, Loki and Prometheus health."
              runbook_url: "https://github.com/Positron00/FinApp/blob/main/docs/runbooks/CollectorDropping.md"
              dashboard_url: "http://127.0.0.1:4101/d/payrun-platform"
  - name: CollectorDropping stays quiet with no failure series at all (or vector(0))
    interval: 1m
    input_series:
      - series: 'otelcol_exporter_sent_spans{exporter="otlp_grpc/tempo"}'
        values: "0+100x20"
    alert_rule_test:
      - alertname: CollectorDropping
        eval_time: 16m
        exp_alerts: []
