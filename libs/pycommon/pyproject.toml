[project]
name = "pycommon"
version = "0.1.0"
description = "PayRun shared Python library: settings, logging, OTel, errors, auth, health, DB, Redis, streams, HTTP, rate limits, startup checks, maintenance, app factory"
requires-python = ">=3.14,<3.15"
# Versions: newest stable release published on or before 2026-10-27 (two-week rule).
dependencies = [
  "fastapi>=0.162.0",
  "uvicorn[standard]>=0.54.0",
  "pydantic>=2.14.1",
  "pydantic-settings>=2.16.1",
  "sqlalchemy[asyncio]>=2.1.6",
  "asyncpg>=0.32.0",
  "alembic>=1.20.1",
  "redis>=8.1.0",
  "httpx>=0.28.1",
  "pyjwt[crypto]>=2.15.1",
  "cryptography>=50.0.2",
  "opentelemetry-api>=1.45.1",
  "opentelemetry-sdk>=1.45.1",
  "opentelemetry-exporter-otlp-proto-grpc>=1.45.1",
  "opentelemetry-instrumentation-fastapi>=0.66b1",
  "opentelemetry-instrumentation-httpx>=0.66b1",
  "opentelemetry-instrumentation-sqlalchemy>=0.66b1",
  "opentelemetry-instrumentation-redis>=0.66b1",
  "opentelemetry-instrumentation-system-metrics>=0.66b1",
  "opentelemetry-instrumentation-logging>=0.66b1",
]

[project.optional-dependencies]
testing = ["pytest>=9.1.1", "testcontainers[postgres,redis]>=4.15.0", "respx>=0.23.1", "time-machine>=3.6.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pycommon"]

[tool.pytest.ini_options]
# pytest-socket auto-registers as "socket"; the gate passes "-p pytest_socket" explicitly, which
# would register it a second time, so the entry-point copy is disabled here.
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
timeout = 60
testpaths = ["tests"]
markers = ["integration: needs Docker (Testcontainers)"]
