[project]
name = "bank_stub"
version = "0.1.0"
description = "PayRun bank-stub: a simulated payment processor with a persistent idempotent ledger (dev and uat only)"
requires-python = ">=3.14,<3.15"
# Versions: newest stable release published on or before 2026-10-27 (two-week rule).
dependencies = [
  "pycommon",
  "fastapi>=0.162.0",
  "sqlalchemy[asyncio]>=2.1.6",
  "asyncpg>=0.32.0",
  "alembic>=1.20.1",
]

[tool.uv.sources]
pycommon = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bank_stub"]

[tool.pytest.ini_options]
addopts = "--strict-markers"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
timeout = 120
testpaths = ["tests"]
markers = ["integration: needs Docker (Testcontainers)"]

[tool.coverage.run]
branch = true

[tool.coverage.report]
fail_under = 85  # C63: per-member gate (85 for services)
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "@overload"]
