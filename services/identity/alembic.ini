# Alembic for schema identity (identity LLD §2.9). The DB connection comes from the C1 keys
# DB_HOST/DB_PORT/DB_NAME/DB_USER/DB_PASSWORD (migrator credentials) via pycommon.
[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = os

[loggers]
keys = root

[handlers]
keys =

[formatters]
keys =

[logger_root]
level = WARNING
handlers =
