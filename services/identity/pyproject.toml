[project]
name = "identity"
version = "0.1.0"
description = "PayRun identity service: users, credentials, invites, sign-in, auth audit and the email relay"
requires-python = ">=3.14,<3.15"
# Versions: newest stable release published on or before 2026-10-27 (two-week rule).
dependencies = [
  "pycommon",
  "fastapi>=0.162.0",
  "sqlalchemy[asyncio]>=2.1.6",
  "asyncpg>=0.32.0",
  "alembic>=1.20.1",
  "redis>=8.1.0",
  "argon2-cffi>=25.1.0",
  "aiosmtplib>=5.1.3",
  "jinja2>=3.1.6",
  "email-validator>=2.3.0",
]

[dependency-groups]
dev = ["aiosmtpd>=1.4.6"]

[tool.uv.sources]
pycommon = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/identity"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
timeout = 120
testpaths = ["tests"]
addopts = "--strict-markers"
markers = ["integration: needs Docker (Testcontainers)", "smoke: PR fault smoke tests"]
