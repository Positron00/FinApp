[project]
name = "payout_worker"
version = "0.1.0"
description = "PayRun payout-worker: consumes payout.requested, calls the bank and reports results to payroll"
requires-python = ">=3.14,<3.15"
# Versions: newest stable release published on or before 2026-10-27 (two-week rule).
dependencies = [
  "pycommon",
  "fastapi>=0.162.0",
  "sqlalchemy[asyncio]>=2.1.6",
  "asyncpg>=0.32.0",
  "alembic>=1.20.1",
  "redis>=8.1.0",
  "httpx>=0.28.1",
  "jsonschema>=4.26.0",
]

[dependency-groups]
# The integration suite runs the real payroll and bank-stub apps in-process.
dev = ["payroll", "bank_stub"]

[tool.uv.sources]
pycommon = { workspace = true }
payroll = { workspace = true }
bank_stub = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/payout_worker"]

[tool.pytest.ini_options]
addopts = "--strict-markers"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
timeout = 180
testpaths = ["tests"]
markers = ["integration: needs Docker (Testcontainers)"]
