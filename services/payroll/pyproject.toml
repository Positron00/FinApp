[project]
name = "payroll"
version = "0.1.0"
description = "PayRun payroll service: settings, employees, pay runs, payouts and the payout.requested outbox"
requires-python = ">=3.14,<3.15"
# Versions: newest stable release published on or before 2026-10-27 (two-week rule).
dependencies = [
  "pycommon",
  "email-validator>=2.3.0",
  "jsonschema>=4.26.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/payroll"]

[tool.uv.sources]
pycommon = { workspace = true }

[tool.pytest.ini_options]
addopts = "--strict-markers"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
timeout = 120
testpaths = ["tests"]
markers = ["integration: needs Docker (Testcontainers)"]
