# payroll migrations (design §2.11). Run as payroll_migrator with the C1 DB_* keys and COMPANY_ID:
#   alembic -c services/payroll/alembic.ini upgrade head
[alembic]
script_location = %(here)s/migrations
path_separator = os
prepend_sys_path = .

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)s %(name)s %(message)s
